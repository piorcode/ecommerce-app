server:
  port: 8082

spring:
  application:
    name: cart-service

  datasource:
    url: jdbc:h2:mem:cartdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

product-service:
  base-url: ${PRODUCT_SERVICE_BASE_URL:http://localhost:8081}

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me}
    issuer: ecommerce-cart-service
    expiration-minutes: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.piorcode.ecommerce.cart: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: INFO