services:
  product-service:
    build:
      context: ./product-service
    ports:
      - "8081:8081"

  cart-service:
    build:
      context: ./cart-service
    ports:
      - "8082:8082"
    environment:
      PRODUCT_SERVICE_BASE_URL: http://product-service:8081
    depends_on:
      - product-service